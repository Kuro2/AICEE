[build]
  base = "frontend"
  command = "npm --prefix ../backend-node install && CI=false npm run build"
  publish = "build"

[functions]
  directory = "../backend-node"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
